spring:
  application:
    name: auraspa-backend
  profiles:
    active: dev
  
  # Database Configuration (MySQL - XAMPP)
  datasource:
    url: jdbc:mysql://localhost:3306/auraspa_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # JPA/Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  
  # Mail Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-app-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: auraspa_secret_key_2024_very_secure_key_min_32_chars_long_12345
  expiration: 86400000
  refresh-expiration: 604800000

# Logging Configuration
logging:
  level:
    root: INFO
    com.auraspa: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# CORS Configuration
cors:
  allowed-origins: http://localhost:5178,http://localhost:3000,http://localhost:8080
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
  allowed-headers: '*'
  allow-credentials: true
  max-age: 3600
